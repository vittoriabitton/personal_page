app = "vittoria-bitton"
primary_region = "ord"

[build]

[deploy]
  release_command = "/app/bin/personal_page eval \"PersonalPage.Release.migrate()\""

[env]
  PHX_HOST = "vittoriabitton.blog"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "1m"
    interval = "30s"
    restart_limit = 6
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
